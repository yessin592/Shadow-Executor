name: Build Shadow Executor

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Locate Visual Studio and Build
      shell: cmd
      run: |
        REM Find Visual Studio installation path
        for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath`) do (
          set InstallDir=%%i
        )
        if not defined InstallDir (
          echo "Visual Studio not found!"
          exit /b 1
        )
        echo "Using Visual Studio at: %InstallDir%"
        REM Initialize developer environment
        call "%InstallDir%\Common7\Tools\VsDevCmd.bat" -arch=amd64
        REM Compile resource file
        rc resource.rc
        REM Build Executor DLL
        cl /EHsc /LD Executor.cpp /Fe:Executor.dll /link user32.lib gdi32.lib comctl32.lib version.lib
        REM Build Main EXE
        cl /EHsc main.cpp resource.res /Fe:ShadowExecutor.exe /link user32.lib gdi32.lib comctl32.lib version.lib /SUBSYSTEM:WINDOWS

    - name: Upload Executor DLL
      uses: actions/upload-artifact@v4
      with:
        name: Executor-DLL
        path: Executor.dll

    - name: Upload Main EXE
      uses: actions/upload-artifact@v4
      with:
        name: Shadow-Executor-EXE
        path: ShadowExecutor.exe
